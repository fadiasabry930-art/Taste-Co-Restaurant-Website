<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste & Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <section id="contact">
        <div class="container">

            <h2>Contact Us</h2>
            <p>We'd love to hear from you!</p>
            <div class="contact-content">
                <form id="contactForm">
                    <h3>Contact Form</h3>
                    <label for="name">Name *</label>
                    <input type="text" id="name" placeholder="Your Name">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="Your Email">
                    <label for="message">Message *</label>
                    <textarea id="message" placeholder="Your Message"></textarea>
                    <button type="submit">Send Message</button>
                    <div id="formMessage"></div>
                </form>
                <div class="visit-card">
                    <h3>Visit Us</h3>
                    <p><i class="fa-solid fa-location-dot"></i> Main Street, City Center</p>
                    <p><i class="fa-solid fa-phone-flip"></i>+20 100 000 0000</p>
                    <div class="social-links">
                        <a href="#"><i class="fa-brands fa-facebook"></i></a>
                        <a href="#"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#"><i class="fa-brands fa-square-twitter"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script type="module" src="js/main.js"></script>
</body>

</html>
