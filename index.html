
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bella Italia Restaurant</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header id="home">

        <!-- Navbar -->
        <nav class="navbar">

            <!-- Logo -->
            <a href="#home" class="logo">
                <i class="fa-solid fa-utensils"></i>
                Bella Italia
            </a>

            <!-- Mobile Menu Button -->
            <button class="menu-toggle" id="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Navigation Links -->
            <ul class="nav-links" id="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#offers">Offers</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

        </nav>

        <!-- Hero Content -->
        <div class="hero-content">

            <p class="subtitle">WELCOME TO BELLA ITALIA</p>

            <h1>Enjoy Our Delicious Food</h1>

            <p class="hero-description">
                Experience the taste of authentic Italian cuisine
                made with love and fresh ingredients.
            </p>

            <a href="#menu" class="hero-btn">
                Explore Our Menu
            </a>

        </div>

    </header>

    <!-- About Section -->
    <section id="about"></section>

    <!-- Offers Section -->
    <section id="offers"></section>

    <!-- Menu Section -->
    <section id="menu"></section>

    <!-- Gallery Section -->
    <section id="gallery"></section>

    <!-- Contact Section -->
    <section id="contact"></section>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
